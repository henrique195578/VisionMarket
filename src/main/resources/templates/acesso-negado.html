<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retomar acesso · VisionMarket</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8d7da;
            color: #721c24;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid #f5c6cb;
        }
        h1 { margin-bottom: 1rem; }
        p { margin-bottom: 2rem; }
        .btn {
            background-color: #dc3545;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vamos retomar sua lista?</h1>
        <p>Sua sessão expirou ou o sistema foi reiniciado. Os itens já salvos continuam disponíveis.</p>
        <a class="btn" href="/?etapa=lista">Voltar à minha lista</a>
    </div>
</body>
</html>
